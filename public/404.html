<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Guess Flag!</title>
  <script>
    // SPA redirect hack for GitHub Pages.
    // When GH Pages serves a 404, redirect to the root with the path encoded
    // as a query param so the app can restore it.
    // HashLocationStrategy makes this unnecessary, but it's kept as a safety net.
    var l = window.location;
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash);
  </script>
</head>
<body></body>
</html>
